name: News update
on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, update.py, feeds.json]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: |
          git config user.name news-bot
          git config user.email news-bot@users.noreply.github.com
          git add news.json
          git diff --staged --quiet || (git commit -m "news update" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
